name: Godot workshop regression
on: [push, pull_request]
jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Parse the native project
        run: godot --headless --path godot --editor --quit
      - name: Check progression rules
        run: godot --headless --path godot --script res://test_progression.gd
      - name: Run workshop scene progression
        run: godot --headless --path godot --script res://test_workshop.gd
