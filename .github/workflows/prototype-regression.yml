name: Prototype 0.2 regression
on: [push, pull_request]
jobs:
  opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check prototype-3d.js
      - run: node --check maker-opening.js
      - run: node --check reference-assets.js
      - run: node --check terminal-browser.js
      - run: node --check workshop-system.js
      - run: node --check workshop-rules.js
      - run: node --check access-probe.js
      - run: node --check opening-guidance.js
      - run: node --check room-layout.js
      - run: node --check room-story.js
      - run: node --check observation-view.js
      - run: node --check main-menu.js
      - run: node --check menu-saves.js
      - run: node --check menu-screen.js
      - name: Load the game renderer for geometry regression tests
        run: curl --fail --silent --show-error --location https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js --output /tmp/saturn-three.mjs
      - run: node --test tests/*.test.mjs
        env:
          THREE_MODULE: file:///tmp/saturn-three.mjs
